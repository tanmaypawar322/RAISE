<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | RAISE लोकआवाज</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #fafaf9;
      color: #1c1917;
      text-align: center;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e7e5e4;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 400px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .badge {
      display: inline-block;
      width: 56px;
      height: 56px;
      line-height: 56px;
      border-radius: 50%;
      background: #ffedd5;
      color: #ea580c;
      font-size: 28px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 18px;
      font-weight: 800;
      margin: 0 0 8px;
    }
    p {
      font-size: 13px;
      color: #57534e;
      line-height: 1.5;
      margin: 0 0 20px;
    }
    button {
      background: #ea580c;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">📡</div>
    <h1>इंटरनेट कनेक्शन उपलब्ध नाही (Offline)</h1>
    <p>You are currently offline. Your saved drafts in RAISE remain safe. Please check your network connection and try again.</p>
    <button onclick="window.location.reload()">Retry Connection (पुन्हा प्रयत्न करा)</button>
  </div>
</body>
</html>
